<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A quote generator built by The Dev Circle.">
  <title>Daily Inspiration | The Dev Circle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> <!-- Link to the CSS file using a Python Framework called Flask -->
  <script src="{{ url_for('static', filename='script.js') }}" defer></script> <!-- Link to the JavaScript file using a Python Framework called Flask -->
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">THE DEV CIRCLE</p>
      <h1>Daily Inspiration</h1>
      <p>Discover motivational quotes on your coding journey.</p>
    </header>
    <blockquote class="quote-box" aria-label="Daily quote" aria-live="polite">
      <p id="quote-text">Every great developer starts somewhere.</p>

      <footer>
        <p id="quote-author" class="quote-author">— The Dev Circle</p>
      </footer>
    </blockquote>
    <button type="button" id="new-quote">Generate Another Quote</button>
    <p class="hint">Made together by The Dev Circle 💜</p>
  </main>
</body>
</html>
